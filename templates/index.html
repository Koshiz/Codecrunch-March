<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Resume RAG App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

    <h1 class="mb-4">Resume RAG Application</h1>

    <!-- Upload Form -->
    <form action="/upload" method="POST" enctype="multipart/form-data" class="mb-4">
        <div class="mb-3">
            <label class="form-label">Upload Resume (PDF):</label>
            <input type="file" name="resume" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Upload</button>
    </form>

    <!-- Search Form -->
    <form action="/search" method="POST">
        <div class="mb-3">
            <label class="form-label">Search Query:</label>
            <input type="text" name="query" class="form-control" placeholder="e.g., Python AWS developer" required>
        </div>
        <button type="submit" class="btn btn-success">Search Resumes</button>
    </form>

</body>
</html>
